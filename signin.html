<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | University Events</title>
  <link rel="stylesheet" href="signin.css" />
</head>
<body>

  <div class="signin-container">
    <div class="left-panel">
      <div class="overlay">
        <h1>Welcome Back!</h1>
        <p>Manage, create, and join university events seamlessly.</p>
      </div>
    </div>

    <div class="right-panel">
      <h2>Sign In</h2>
      <form action="#" method="POST" class="signin-form">
        <div class="input-group">
          <label for="email">University Email</label>
          <input type="email" id="email" name="email" placeholder="example@university.edu" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>

        <div class="options">
          <label><input type="checkbox" name="remember" /> Remember me</label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Sign In</button>

        <p class="signup-text">
          Don’t have an account? <a href="signup.html">Create one</a>
          
        </p>
      </form>
    </div>
  </div>

</body>
</html>
