<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | University Events</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body>

  <div class="signup-container">
    <!-- Left Side (Brand/Image) -->
    <div class="left-panel">
      <div class="overlay">
        <h1>Join the Campus Buzz!</h1>
        <p>Create, manage, and explore university events with ease.</p>
      </div>
    </div>

    <!-- Right Side (Form) -->
    <div class="right-panel">
      <h2>Create Account</h2>
      <form action="#" method="POST" class="signup-form">
        
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required />
        </div>

        <div class="input-group">
          <label for="email">University Email</label>
          <input type="email" id="email" name="email" placeholder="example@university.edu" required />
        </div>

        <div class="input-group">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="organizer">Event Organizer</option>
          </select>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create password" required />
        </div>

        <div class="input-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required />
        </div>

        <button type="submit" class="btn">Sign Up</button>

        <p class="signin-text">
          Already have an account? <a href="signin.html">Sign In</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
